<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Sedekah Online</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        emerald: {
                            50: '#ecfdf5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f1f5f9; }
        /* Scrollbar Utilities */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-gray-800 flex h-screen overflow-hidden">

    <aside class="w-64 bg-white border-r border-gray-200 hidden md:flex flex-col shadow-sm">
        <div class="h-20 flex items-center px-6 border-b border-gray-100">
            <i class="fa-solid fa-hand-holding-heart text-2xl text-emerald-500 mr-2"></i>
            <span class="font-bold text-xl text-gray-800">Admin<span class="text-emerald-500">Panel</span></span>
        </div>
        
        <nav class="flex-1 p-4 space-y-2">
            <a href="#" class="flex items-center gap-3 px-4 py-3 bg-emerald-50 text-emerald-600 rounded-lg font-medium transition-colors">
                <i class="fa-solid fa-table-list w-5 text-center"></i> Kelola Program
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg font-medium transition-colors">
                <i class="fa-solid fa-users w-5 text-center"></i> Data Donatur
            </a>
            <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg font-medium transition-colors">
                <i class="fa-solid fa-gear w-5 text-center"></i> Pengaturan
            </a>
        </nav>

        <div class="p-4 border-t border-gray-100">
            <button class="flex items-center gap-3 px-4 py-3 text-red-500 hover:bg-red-50 w-full rounded-lg font-medium transition-colors">
                <i class="fa-solid fa-right-from-bracket w-5 text-center"></i> Keluar
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        
        <header class="h-20 bg-white border-b border-gray-200 flex items-center justify-between px-6 sticky top-0 z-10 shadow-sm">
            <div class="flex items-center gap-4">
                <button class="md:hidden text-gray-500 text-xl hover:text-emerald-500"><i class="fa-solid fa-bars"></i></button>
                <h1 class="text-xl font-bold text-gray-800">Kelola Program Donasi</h1>
            </div>
            <div class="flex items-center gap-3 cursor-pointer hover:bg-gray-50 px-3 py-1.5 rounded-lg transition-colors">
                <div class="w-10 h-10 bg-emerald-100 rounded-full flex items-center justify-center text-emerald-600 font-bold">A</div>
                <span class="font-medium hidden sm:block text-gray-700">Administrator</span>
            </div>
        </header>

        <div class="p-6 overflow-y-auto flex-1">
            <div class="max-w-7xl mx-auto w-full">
                
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                    <div class="relative w-full sm:w-80">
                        <input type="text" placeholder="Cari nama program..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400"></i>
                    </div>
                    <button id="btnTambah" class="bg-emerald-500 hover:bg-emerald-600 text-white px-5 py-2 rounded-lg font-medium shadow-sm transition-all text-sm w-full sm:w-auto flex items-center justify-center">
                        <i class="fa-solid fa-plus mr-2"></i> Tambah Program
                    </button>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse min-w-[800px]">
                            <thead>
                                <tr class="bg-gray-50 border-b border-gray-200 text-sm text-gray-600 uppercase tracking-wider">
                                    <th class="p-4 font-semibold w-12 text-center">No</th>
                                    <th class="p-4 font-semibold">Nama Program</th>
                                    <th class="p-4 font-semibold">Kategori</th>
                                    <th class="p-4 font-semibold text-right">Target (Rp)</th>
                                    <th class="p-4 font-semibold text-right">Terkumpul (Rp)</th>
                                    <th class="p-4 font-semibold text-center w-32">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <tr>
                                    <td colspan="6" class="p-12 text-center text-gray-500">
                                        <i class="fa-solid fa-circle-notch fa-spin text-3xl text-emerald-500 mb-3"></i>
                                        <p class="text-sm font-medium">Menghubungkan ke Firebase Database...</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <div id="modalForm" class="fixed inset-0 bg-gray-900/60 hidden items-center justify-center z-50 backdrop-blur-sm transition-opacity opacity-0">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg mx-4 overflow-hidden transform scale-95 transition-transform duration-300" id="modalContent">
            
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h3 class="font-bold text-lg text-gray-800" id="modalTitle">Tambah Program Baru</h3>
                <button id="btnCloseModal" class="text-gray-400 hover:text-red-500 transition-colors w-8 h-8 flex items-center justify-center rounded-full hover:bg-white">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <div class="p-6">
                <form id="programForm" class="space-y-4">
                    <input type="hidden" id="programId">
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">Nama Program <span class="text-red-500">*</span></label>
                        <input type="text" id="namaProgram" required placeholder="Contoh: Beasiswa Tahfidz" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">Kategori <span class="text-red-500">*</span></label>
                            <select id="kategori" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm bg-white">
                                <option value="Pendidikan">Pendidikan</option>
                                <option value="Kemanusiaan">Kemanusiaan</option>
                                <option value="Infrastruktur">Infrastruktur</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">Target Donasi (Rp) <span class="text-red-500">*</span></label>
                            <input type="number" id="targetDonasi" required placeholder="10000000" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">Deskripsi Singkat</label>
                        <textarea id="deskripsi" rows="3" placeholder="Tulis deskripsi singkat program..." class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-sm resize-none"></textarea>
                    </div>
                    
                    <div class="pt-2">
                        <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-medium py-3 rounded-lg transition-colors shadow-sm flex items-center justify-center">
                            <i class="fa-solid fa-floppy-disk mr-2"></i> Simpan Data Program
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <script src="admin.js"></script>
</body>
</html>
